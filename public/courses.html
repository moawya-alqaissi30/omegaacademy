<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدورات | OMEGA Academy</title>
  <link rel="icon" href="./img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- شريط التنقل العلوي -->
  <nav class="navbar">
    <div class="brand">
      <img src="./img/logo.png" alt="شعار OMEGA Academy">
      <div class="brand-name">OMEGA <span>Academy</span></div>
    </div>
    <button class="navbar-toggle">☰</button>
    <ul class="nav-links">
      <li><a href="./index.html">الرئيسية</a></li>
      <li><a href="./resources.html">المكتبة</a></li>
      <li><a href="./subjects-newspaper.html">جريدة المواد</a></li>
      <li><a href="./courses.html" class="active">الدورات</a></li>
      <li><a href="./programs.html">البرامج</a></li>
      <li><a href="./gpa.html">حساب المعدل</a></li>
      <li><a href="./contact.html">تواصل معنا</a></li>
      <li id="auth-area"></li>
    </ul>
  </nav>

  <!-- قسم الدورات -->
  <section class="section">
    <h2 class="section-title">الدورات</h2>
    <p class="section-subtitle">دورات عملية تساعدك على تطوير مهاراتك الهندسية والتقنية.</p>
    <div class="grid" id="courses-grid"></div>
  </section>

  <!-- التذييل Footer -->
  <footer>
    <div class="social">
      <a href="https://www.facebook.com/share/1HXUwC6CDM/?mibextid=wwXIfr" target="_blank" rel="noopener">فيسبوك</a>
      <a href="https://www.instagram.com/omega__hu?igsi=MWMzbTNhemV3dDYzbA%3D%3D&utm_source=qr" target="_blank" rel="noopener">انستقرام</a>
    </div>
    <p>© 2026 OMEGA Academy — بإشراف م. معاوية القيسي. جميع الحقوق محفوظة.</p>
  </footer>

  <script src="./js/app.js"></script>
  <script>
    (async () => {
      const grid = document.getElementById('courses-grid');
      // true = تظهر "ستتوفر قريباً" دائماً. غيّرها لـ false لما تجهّز دورات حقيقية.
      const SHOW_COMING_SOON = true;
      const comingSoon = '<p class="empty-state" style="grid-column:1/-1;text-align:center;font-size:1.4rem;">ستتوفر قريباً</p>';
      if (SHOW_COMING_SOON) { grid.innerHTML = comingSoon; return; }
      try {
        const data = await api('/api/courses');
        if (!data.courses || !data.courses.length) {
          grid.innerHTML = comingSoon;
          return;
        }
        grid.innerHTML = data.courses.map(c => `
          <div class="card">
            <span class="badge">${escapeHtml(c.category || 'دورة')}</span>
            <h3>${escapeHtml(c.title)}</h3>
            <p>${escapeHtml(c.description || '')}</p>
            <div class="card-footer">
              <span style="color:var(--gray-text);font-size:.82rem;">${escapeHtml(c.duration || 'قريباً')}</span>
            </div>
          </div>
        `).join('');
      } catch (e) {
        grid.innerHTML = comingSoon;
      }
    })();
  </script>
</body>
</html>
